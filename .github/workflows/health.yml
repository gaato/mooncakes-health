name: Health

on:
  schedule:
    # After the daily canaries of the gaato repositories (21:00-22:40 UTC),
    # which share the account's limit of 20 concurrent jobs.
    - cron: "47 22 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: health
  cancel-in-progress: false

env:
  SITE: https://gaato.github.io/mooncakes-health

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    container:
      image: ghcr.io/gaato/moonbit:latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Python
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends python3

      - name: Fetch the registry index
        run: moon update

      - name: Plan
        id: plan
        run: python3 -m health.plan --moon "$(moon version --all)" --previous "$SITE" --out plan

      # The check job gets the probe from here, so it needs no checkout and
      # no token at all.
      - name: Bundle the probe
        run: cp -r health plan/

      - name: Upload the plan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plan
          path: plan/
          retention-days: 7

  check:
    needs: plan
    if: needs.plan.outputs.shards != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    # Builds third-party modules, whose build scripts run here: no token
    # scopes, no secrets, no caches shared with other workflows. The results
    # are validated by the publish job.
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    container:
      image: ghcr.io/gaato/moonbit:latest
    steps:
      - name: Download the plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plan
          path: plan

      - name: Install Python
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends python3

      - name: Fetch the registry index
        run: |
          moon version --all
          moon update

      # A step timeout, so the results so far are still uploaded.
      - name: Check the modules of this shard
        timeout-minutes: 120
        working-directory: plan
        env:
          SHARD: ${{ matrix.shard }}
        run: python3 -m health.probe "shard-$SHARD.jsonl" "$GITHUB_WORKSPACE/result-$SHARD.jsonl"

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: result-${{ matrix.shard }}
          path: result-*.jsonl
          retention-days: 7

  publish:
    needs: [plan, check]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plan
          path: plan

      - name: Download the results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: result-*
          path: results
          merge-multiple: true

      # Runs the checked-out publish code, never the bundled copy.
      - name: Build the site
        run: python3 -m health.publish --plan plan/plan.json --results results --formats plan/formats.json --out dist

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
